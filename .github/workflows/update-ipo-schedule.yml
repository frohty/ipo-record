name: Update IPO schedule

on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ipo-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch verified IPO filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_ipo_schedule.py
      - name: Validate generated data
        run: python -m unittest discover -s tests -v
      - name: Save changed schedule
        run: |
          if git diff --quiet -- ipo-schedule.json; then
            echo "No schedule changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipo-schedule.json
          git commit -m "chore: update IPO schedule"
          git push
